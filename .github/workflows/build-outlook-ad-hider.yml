name: Build Outlook Ad Hider V4

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Patch worker for V4
        shell: pwsh
        run: |
          $path = "NOP\worker\dllmain.cpp"
          $content = Get-Content -Path $path -Raw

          # Keep the proven Outlook ad selector.
          $cssPattern = '(?s)const cssClass = \\"\\.*?styleElement\.appendChild'
          $cssReplacement = @'
          const cssClass = \"\
          [data-message-ad-id] { display: none !important; }\";\n\
          styleElement.appendChild
          '@
          if (-not [regex]::IsMatch($content, $cssPattern)) {
            throw "Could not locate CSS injection block."
          }
          $content = [regex]::Replace($content, $cssPattern, $cssReplacement, 1)

          # Do not intercept F12.
          $content = $content.Replace(
            'const wchar_t* isF12Enabled = L"y_1A36CD25-E20F-4D0D-B1E6-3CC4307E1488";',
            'const wchar_t* isF12Enabled = L"n_1A36CD25-E20F-4D0D-B1E6-3CC4307E1488";'
          )

          # V4: inject the wide-layout compatibility shim BEFORE Outlook/React starts.
          $needle = @'
                  winrt::check_hresult(createdController->get_CoreWebView2(webview.put()));

                  EventRegistrationToken tkn_NavigationCompleted;
          '@

          $insert = @'
                  winrt::check_hresult(createdController->get_CoreWebView2(webview.put()));

                  // V4 - keep Outlook's folder pane in wide-layout mode.
                  // This runs at document creation time, before Outlook/React initializes.
                  const wchar_t* wideLayoutScript = LR"MBJS(
          (() => {
            if (window.__MB_WIDE_LAYOUT_V4__) return;
            Object.defineProperty(window, '__MB_WIDE_LAYOUT_V4__', {
              value: true,
              configurable: false,
              enumerable: false,
              writable: false
            });

            const MIN_WIDE_WIDTH = 1200;

            // Outlook can use JS media queries for responsive layout.
            // Make width-only media queries behave as if the viewport remains wide.
            try {
              const nativeMatchMedia = window.matchMedia.bind(window);
              window.matchMedia = function(query) {
                let q = String(query);

                q = q.replace(
                  /\(\s*max-width\s*:\s*[\d.]+px\s*\)/gi,
                  '(max-width: 0px)'
                );

                q = q.replace(
                  /\(\s*min-width\s*:\s*[\d.]+px\s*\)/gi,
                  '(min-width: 0px)'
                );

                return nativeMatchMedia(q);
              };
            } catch (_) {}

            // Outlook also uses ResizeObserver in parts of its responsive layout.
            // Clamp only top-level app/navigation measurements, not every control.
            try {
              const NativeResizeObserver = window.ResizeObserver;

              if (NativeResizeObserver) {
                const shouldClamp = (target) => {
                  try {
                    if (!target || target.nodeType !== 1) return false;

                    if (target.id === 'MainModule') return true;
                    if (target.getAttribute?.('data-app-section') === 'NavigationPane') return true;

                    return !!target.querySelector?.(
                      '#MainModule, [data-app-section="NavigationPane"]'
                    );
                  } catch (_) {
                    return false;
                  }
                };

                const patchSizes = (sizes) => {
                  if (!sizes) return sizes;
                  try {
                    return Array.from(sizes, s => ({
                      inlineSize: Math.max(Number(s.inlineSize) || 0, MIN_WIDE_WIDTH),
                      blockSize: Number(s.blockSize) || 0
                    }));
                  } catch (_) {
                    return sizes;
                  }
                };

                window.ResizeObserver = class MBResizeObserver {
                  constructor(callback) {
                    this._inner = new NativeResizeObserver((entries, observer) => {
                      const patched = entries.map(entry => {
                        if (!shouldClamp(entry.target)) return entry;

                        const r = entry.contentRect;
                        const width = Math.max(Number(r.width) || 0, MIN_WIDE_WIDTH);

                        const patchedRect = {
                          x: r.x,
                          y: r.y,
                          top: r.top,
                          right: r.left + width,
                          bottom: r.bottom,
                          left: r.left,
                          width,
                          height: r.height,
                          toJSON: () => ({
                            x: r.x,
                            y: r.y,
                            top: r.top,
                            right: r.left + width,
                            bottom: r.bottom,
                            left: r.left,
                            width,
                            height: r.height
                          })
                        };

                        return new Proxy(entry, {
                          get(target, prop) {
                            if (prop === 'contentRect') return patchedRect;
                            if (prop === 'contentBoxSize') return patchSizes(target.contentBoxSize);
                            if (prop === 'borderBoxSize') return patchSizes(target.borderBoxSize);
                            if (prop === 'devicePixelContentBoxSize') {
                              return patchSizes(target.devicePixelContentBoxSize);
                            }
                            return Reflect.get(target, prop, target);
                          }
                        });
                      });

                      callback.call(this, patched, this);
                    });
                  }

                  observe(target, options) {
                    return this._inner.observe(target, options);
                  }

                  unobserve(target) {
                    return this._inner.unobserve(target);
                  }

                  disconnect() {
                    return this._inner.disconnect();
                  }
                };
              }
            } catch (_) {}
          })();
          )MBJS";

                  HRESULT wideScriptHr = webview->AddScriptToExecuteOnDocumentCreated(
                      wideLayoutScript,
                      Microsoft::WRL::Callback<ICoreWebView2AddScriptToExecuteOnDocumentCreatedCompletedHandler>(
                          [](HRESULT errorCode, LPCWSTR id) -> HRESULT {
                              if (SUCCEEDED(errorCode)) {
                                  DbgPrintf(L"NOP V4: wide-layout startup script registered");
                              } else {
                                  DbgPrintf(L"NOP V4: wide-layout startup script failed 0x%08X", errorCode);
                              }
                              return S_OK;
                          }
                      ).Get()
                  );

                  if (FAILED(wideScriptHr)) {
                      DbgPrintf(L"NOP V4: AddScriptToExecuteOnDocumentCreated failed 0x%08X", wideScriptHr);
                  }

                  EventRegistrationToken tkn_NavigationCompleted;
          '@

          if (-not $content.Contains($needle)) {
            throw "Could not locate WebView2 controller initialization point."
          }
          $content = $content.Replace($needle, $insert)

          # Keep the working V3 WebView2 hook trigger.
          $hookPattern = '(?s)HMODULE WINAPI HookLoadLibraryExW\(LPCWSTR lpLibFileName, HANDLE hFile, DWORD dwFlags\)\s*\{.*?\}\s*$'
          $hookReplacement = @'
          HMODULE WINAPI HookLoadLibraryExW(LPCWSTR lpLibFileName, HANDLE hFile, DWORD dwFlags)
          {
              auto result = ::LoadLibraryExW(lpLibFileName, hFile, dwFlags);

              static volatile LONG hookInstalled = 0;
              static volatile LONG hookInstalling = 0;

              if (::GetModuleHandleW(L"WebView2Loader.dll") != nullptr &&
                  ::InterlockedCompareExchange(&hookInstalled, 0, 0) == 0 &&
                  ::InterlockedCompareExchange(&hookInstalling, 1, 0) == 0)
              {
                  MH_STATUS status = MH_Initialize();
                  if (status != MH_OK && status != MH_ERROR_ALREADY_INITIALIZED)
                  {
                      DbgPrintf(L"NOP: Error initialising MinHook 0x%08X", status);
                      ::InterlockedExchange(&hookInstalling, 0);
                      return result;
                  }

                  status = MH_CreateHookApiEx(
                      L"WebView2Loader.dll",
                      "CreateCoreWebView2EnvironmentWithOptions",
                      &_CreateCoreWebView2EnvironmentWithOptions,
                      reinterpret_cast<void**>(&pCreateCoreWebView2EnvironmentWithOptions),
                      reinterpret_cast<void**>(&pCreateCoreWebView2EnvironmentWithOptionsTarget)
                  );

                  if (status != MH_OK && status != MH_ERROR_ALREADY_CREATED)
                  {
                      DbgPrintf(L"NOP: Error creating WebView2 hook 0x%08X", status);
                      ::InterlockedExchange(&hookInstalling, 0);
                      return result;
                  }

                  status = MH_EnableHook(MH_ALL_HOOKS);
                  if (status != MH_OK && status != MH_ERROR_ENABLED)
                  {
                      DbgPrintf(L"NOP: Error enabling WebView2 hook 0x%08X", status);
                      ::InterlockedExchange(&hookInstalling, 0);
                      return result;
                  }

                  ::InterlockedExchange(&hookInstalled, 1);
                  ::InterlockedExchange(&hookInstalling, 0);
                  DbgPrintf(L"NOP: WebView2 hook installed");
              }

              return result;
          }
          '@

          if (-not [regex]::IsMatch($content, $hookPattern)) {
            throw "Could not locate HookLoadLibraryExW."
          }
          $content = [regex]::Replace($content, $hookPattern, $hookReplacement, 1)

          [System.IO.File]::WriteAllText(
            (Resolve-Path $path),
            $content,
            [System.Text.UTF8Encoding]::new($true)
          )

          Write-Host "V4 markers:"
          Select-String -Path $path -Pattern "__MB_WIDE_LAYOUT_V4__"
          Select-String -Path $path -Pattern "AddScriptToExecuteOnDocumentCreated"
          Select-String -Path $path -Pattern "data-message-ad-id"
          Select-String -Path $path -Pattern "WebView2 hook installed"

      - name: Restore native packages
        shell: cmd
        run: nuget restore NOP\worker\packages.config -PackagesDirectory packages -NonInteractive

      - name: Build x64 worker DLL
        shell: pwsh
        run: |
          $outDir = Join-Path $env:GITHUB_WORKSPACE "out"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          & msbuild "NOP\worker\worker.vcxproj" /m /p:Configuration=Release /p:Platform=x64 "/p:OutDir=$outDir\"

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Prepare V4 package
        shell: pwsh
        run: |
          $package = Join-Path $env:GITHUB_WORKSPACE "package"
          $builtDll = Join-Path $env:GITHUB_WORKSPACE "out\dxgi.dll"

          if (-not (Test-Path $builtDll)) {
            throw "Built dxgi.dll was not found."
          }

          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item $builtDll (Join-Path $package "NewOutlookPatcher.dll") -Force

          $update = @'
          @echo off
          setlocal EnableExtensions
          title Outlook Ad Hider V4 - UPDATE

          fltmc >nul 2>&1
          if errorlevel 1 (
              powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Start-Process -FilePath $env:ComSpec -ArgumentList '/c','\"%~f0\"' -Verb RunAs"
              exit /b
          )

          echo.
          echo Closing New Outlook...
          taskkill /F /IM olk.exe /T >nul 2>&1

          for /L %%N in (1,1,20) do (
              tasklist /FI "IMAGENAME eq olk.exe" 2>nul | find /I "olk.exe" >nul
              if errorlevel 1 goto :copydll
              timeout /t 1 /nobreak >nul
          )

          :copydll
          echo Replacing V3 DLL with V4...
          for /L %%N in (1,1,10) do (
              copy /Y "%~dp0NewOutlookPatcher.dll" "%SystemRoot%\System32\NewOutlookPatcher.dll" >nul 2>&1
              if not errorlevel 1 goto :verify
              timeout /t 1 /nobreak >nul
          )

          echo.
          echo ERROR: DLL is still locked and could not be replaced.
          echo Restart Windows, then run this file again BEFORE opening Outlook.
          echo.
          pause
          exit /b 1

          :verify
          fc /b "%~dp0NewOutlookPatcher.dll" "%SystemRoot%\System32\NewOutlookPatcher.dll" >nul
          if errorlevel 1 (
              echo.
              echo ERROR: DLL verification failed.
              echo.
              pause
              exit /b 1
          )

          echo.
          echo ============================================
          echo   V4 DLL INSTALLED SUCCESSFULLY
          echo ============================================
          echo.
          echo Opening Outlook...
          start "" explorer.exe "shell:AppsFolder\Microsoft.OutlookForWindows_8wekyb3d8bbwe!Microsoft.OutlookforWindows"
          echo.
          echo Test resizing the Outlook window.
          echo.
          pause
          '@

          $readme = @'
          Outlook Ad Hider V4
          --------------------
          Keeps the working V3 ad rule:
          [data-message-ad-id] { display: none !important; }

          Adds an experimental startup-time wide-layout patch BEFORE Outlook/React loads.
          It adjusts width-based matchMedia queries and selected ResizeObserver measurements
          so Outlook is less likely to unmount the folder pane when the window gets narrower.

          Diagnostic:
          Open DevTools Console and run:
          window.__MB_WIDE_LAYOUT_V4__
          It should return true.

          Existing IFEO/AppVerifier settings stay unchanged.
          Chrome and Chrome cache are not touched.

          If V4 causes unwanted layout behavior, reinstall the saved V3 package.
          '@

          Set-Content -Path (Join-Path $package "UPDATE-Outlook-Ad-Hider-V4.cmd") -Value $update -Encoding ASCII
          Set-Content -Path (Join-Path $package "README.txt") -Value $readme -Encoding UTF8

      - name: Upload V4 package
        uses: actions/upload-artifact@v4
        with:
          name: Outlook-Ad-Hider-V4
          path: package
          if-no-files-found: error
