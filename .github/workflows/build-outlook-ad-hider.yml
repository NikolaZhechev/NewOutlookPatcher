name: Build Outlook Ad Hider V8.1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Patch worker for Outlook V8.1
        shell: pwsh
        run: |
          $path = "NOP\worker\dllmain.cpp"
          $content = Get-Content -Path $path -Raw

          # V8.1 native/window WebView2 fix:
          # - keep the proven V5 500 px minimum-height change;
          # - keep native horizontal resizing unrestricted;
          # - below 960 logical client px, dynamically lower WebView2 host zoom so the page keeps
          #   approximately the same wide CSS viewport. This lets Outlook's own
          #   responsive React code remain in its real docked FolderPaneContainer layout
          #   instead of switching NavigationPane from Ni89i to a7Ps_ and unmounting YYA9V.
          $nativeNeedle = @'
              OutputDebugStringW(L"\r\n");
          }

          // Example: MinHook signature for CreateCoreWebView2EnvironmentWithOptions
          '@

          $nativeReplacement = @'
              OutputDebugStringW(L"\r\n");
          }

          // MUSICBANTER V8.1 - keep the classic docked folder pane by preserving Outlook's
          // wide logical WebView layout while allowing the native window itself to narrow.
          static const LONG MB_WIDE_LAYOUT_REFERENCE_WIDTH = 960;
          static const LONG MB_MIN_OUTLOOK_HEIGHT = 500;
          static const double MB_MIN_WIDE_LAYOUT_ZOOM = 0.45;
          static HWND g_mbOutlookHost = nullptr;
          static WNDPROC g_mbOriginalOutlookWndProc = nullptr;
          static ICoreWebView2Controller* g_mbWebViewController = nullptr;
          static double g_mbLastZoom = -1.0;

          void MBUpdateOutlookWideLayoutZoom(HWND hWnd)
          {
              if (!hWnd || !g_mbWebViewController)
              {
                  return;
              }

              // Use CLIENT width, because Outlook's responsive WebView layout is based on
              // the drawable content area rather than the outer Win32 window frame.
              RECT clientRect = {};
              if (!::GetClientRect(hWnd, &clientRect))
              {
                  return;
              }

              LONG clientWidthPx = clientRect.right - clientRect.left;
              if (clientWidthPx <= 0)
              {
                  return;
              }

              // GetClientRect is in device pixels for this per-monitor-DPI-aware window.
              // Convert to 96-DPI logical pixels before comparing against the CSS-layout
              // reference width. This is essential at 125%, 150%, etc.
              UINT dpi = ::GetDpiForWindow(hWnd);
              if (dpi == 0)
              {
                  dpi = 96;
              }

              double logicalClientWidth =
                  static_cast<double>(clientWidthPx) * 96.0 /
                  static_cast<double>(dpi);

              double zoom = 1.0;
              if (logicalClientWidth < static_cast<double>(MB_WIDE_LAYOUT_REFERENCE_WIDTH))
              {
                  zoom = logicalClientWidth /
                         static_cast<double>(MB_WIDE_LAYOUT_REFERENCE_WIDTH);
              }

              if (zoom < MB_MIN_WIDE_LAYOUT_ZOOM)
              {
                  zoom = MB_MIN_WIDE_LAYOUT_ZOOM;
              }
              if (zoom > 1.0)
              {
                  zoom = 1.0;
              }

              double delta = zoom - g_mbLastZoom;
              if (delta < 0.0)
              {
                  delta = -delta;
              }

              if (g_mbLastZoom < 0.0 || delta >= 0.002)
              {
                  HRESULT hr = g_mbWebViewController->put_ZoomFactor(zoom);
                  if (SUCCEEDED(hr))
                  {
                      g_mbLastZoom = zoom;
                  }
                  else
                  {
                      DbgPrintf(L"NOP V8.1: put_ZoomFactor failed 0x%08X", hr);
                  }
              }
          }

          void MBRememberOutlookWebViewController(ICoreWebView2Controller* controller)
          {
              if (!controller || g_mbWebViewController)
              {
                  return;
              }

              HWND parentWindow = nullptr;
              if (FAILED(controller->get_ParentWindow(&parentWindow)) || !parentWindow)
              {
                  return;
              }

              HWND root = ::GetAncestor(parentWindow, GA_ROOT);
              if (!root)
              {
                  root = parentWindow;
              }

              WCHAR className[128] = {};
              if (::GetClassNameW(root, className, ARRAYSIZE(className)) <= 0 ||
                  ::lstrcmpW(className, L"Outlook Host") != 0)
              {
                  return;
              }

              controller->AddRef();
              g_mbWebViewController = controller;
              DbgPrintf(L"NOP V8.1: main Outlook WebView2 controller captured");
          }

          bool MBGetCaptionButtonHitTest(HWND hWnd, LPARAM lParam, LRESULT* hitTest)
          {
              if (!hWnd || !hitTest)
              {
                  return false;
              }

              // At 100% zoom Outlook's own title-bar hit testing is correct.
              // Only compensate while our adaptive WebView2 zoom is active.
              if (g_mbLastZoom < 0.0 || g_mbLastZoom >= 0.999)
              {
                  return false;
              }

              RECT windowRect = {};
              if (!::GetWindowRect(hWnd, &windowRect))
              {
                  return false;
              }

              UINT dpi = ::GetDpiForWindow(hWnd);
              if (dpi == 0)
              {
                  dpi = 96;
              }

              LONG buttonWidth = ::GetSystemMetricsForDpi(SM_CXSIZE, dpi);
              LONG captionButtonHeight = ::GetSystemMetricsForDpi(SM_CYSIZE, dpi);
              LONG frameHeight = ::GetSystemMetricsForDpi(SM_CYFRAME, dpi);
              LONG paddedBorder = ::GetSystemMetricsForDpi(SM_CXPADDEDBORDER, dpi);

              // WebView2 Window Controls Overlay uses a title-bar region around 48
              // logical pixels high. Keep at least that much hit area after DPI scaling.
              LONG overlayHeight = ::MulDiv(48, static_cast<int>(dpi), 96);
              LONG hitHeight = captionButtonHeight + frameHeight + paddedBorder;
              if (hitHeight < overlayHeight)
              {
                  hitHeight = overlayHeight;
              }

              if (buttonWidth <= 0 || hitHeight <= 0)
              {
                  return false;
              }

              LONG screenX = static_cast<LONG>(static_cast<short>(LOWORD(lParam)));
              LONG screenY = static_cast<LONG>(static_cast<short>(HIWORD(lParam)));

              // Preserve the very top resize border for non-maximized windows.
              if (!::IsZoomed(hWnd) &&
                  screenY < windowRect.top + frameHeight)
              {
                  return false;
              }

              if (screenY < windowRect.top ||
                  screenY >= windowRect.top + hitHeight ||
                  screenX < windowRect.right - (buttonWidth * 3) ||
                  screenX >= windowRect.right)
              {
                  return false;
              }

              LONG fromRight = windowRect.right - screenX;

              if (fromRight <= buttonWidth)
              {
                  *hitTest = HTCLOSE;
              }
              else if (fromRight <= buttonWidth * 2)
              {
                  *hitTest = HTMAXBUTTON;
              }
              else
              {
                  *hitTest = HTMINBUTTON;
              }

              return true;
          }

          LRESULT CALLBACK MBOutlookHostWndProc(HWND hWnd, UINT uMsg, WPARAM wParam, LPARAM lParam)
          {
              WNDPROC original = g_mbOriginalOutlookWndProc;

              if (!original)
              {
                  return ::DefWindowProcW(hWnd, uMsg, wParam, lParam);
              }

              if (uMsg == WM_NCHITTEST)
              {
                  LRESULT hitTest = HTNOWHERE;
                  if (MBGetCaptionButtonHitTest(hWnd, lParam, &hitTest))
                  {
                      return hitTest;
                  }
              }

              if (uMsg == WM_GETMINMAXINFO)
              {
                  LRESULT result = ::CallWindowProcW(original, hWnd, uMsg, wParam, lParam);

                  auto* info = reinterpret_cast<MINMAXINFO*>(lParam);
                  if (info != nullptr && info->ptMinTrackSize.y > MB_MIN_OUTLOOK_HEIGHT)
                  {
                      info->ptMinTrackSize.y = MB_MIN_OUTLOOK_HEIGHT;
                  }

                  return result;
              }

              if (uMsg == WM_SIZE || uMsg == WM_DPICHANGED)
              {
                  LRESULT result = ::CallWindowProcW(original, hWnd, uMsg, wParam, lParam);
                  MBUpdateOutlookWideLayoutZoom(hWnd);
                  return result;
              }

              return ::CallWindowProcW(original, hWnd, uMsg, wParam, lParam);
          }

          struct MBOutlookWindowSearch
          {
              DWORD processId;
              HWND window;
          };

          BOOL CALLBACK MBFindOutlookHostEnumProc(HWND hWnd, LPARAM lParam)
          {
              auto* search = reinterpret_cast<MBOutlookWindowSearch*>(lParam);
              if (!search)
              {
                  return TRUE;
              }

              DWORD processId = 0;
              ::GetWindowThreadProcessId(hWnd, &processId);
              if (processId != search->processId)
              {
                  return TRUE;
              }

              WCHAR className[128] = {};
              if (::GetClassNameW(hWnd, className, ARRAYSIZE(className)) <= 0)
              {
                  return TRUE;
              }

              if (::lstrcmpW(className, L"Outlook Host") == 0)
              {
                  search->window = hWnd;
                  return FALSE;
              }

              return TRUE;
          }

          void MBInstallOutlookMinHeightHook()
          {
              if (g_mbOutlookHost != nullptr && g_mbOriginalOutlookWndProc != nullptr)
              {
                  MBUpdateOutlookWideLayoutZoom(g_mbOutlookHost);
                  return;
              }

              MBOutlookWindowSearch search = { ::GetCurrentProcessId(), nullptr };
              ::EnumWindows(MBFindOutlookHostEnumProc, reinterpret_cast<LPARAM>(&search));

              if (!search.window)
              {
                  DbgPrintf(L"NOP V8.1: Outlook Host window not found yet");
                  return;
              }

              ::SetLastError(0);
              auto original = reinterpret_cast<WNDPROC>(
                  ::GetWindowLongPtrW(search.window, GWLP_WNDPROC)
              );

              if (!original && ::GetLastError() != ERROR_SUCCESS)
              {
                  DbgPrintf(L"NOP V8.1: GetWindowLongPtrW failed 0x%08X", ::GetLastError());
                  return;
              }

              g_mbOriginalOutlookWndProc = original;

              ::SetLastError(0);
              auto previous = reinterpret_cast<WNDPROC>(
                  ::SetWindowLongPtrW(
                      search.window,
                      GWLP_WNDPROC,
                      reinterpret_cast<LONG_PTR>(MBOutlookHostWndProc)
                  )
              );

              if (!previous && ::GetLastError() != ERROR_SUCCESS)
              {
                  DbgPrintf(L"NOP V8.1: SetWindowLongPtrW failed 0x%08X", ::GetLastError());
                  g_mbOriginalOutlookWndProc = nullptr;
                  return;
              }

              if (previous)
              {
                  g_mbOriginalOutlookWndProc = previous;
              }

              g_mbOutlookHost = search.window;
              DbgPrintf(L"NOP V8.1: 500 px min height + DPI-aware folder pane + caption-button hit-test fix enabled");
              MBUpdateOutlookWideLayoutZoom(g_mbOutlookHost);
          }

          // Example: MinHook signature for CreateCoreWebView2EnvironmentWithOptions
          '@

          if (-not $content.Contains($nativeNeedle)) {
            throw "Could not locate DbgPrintf insertion point."
          }
          $content = $content.Replace($nativeNeedle, $nativeReplacement)

          # Install the native window hook once the WebView controller exists.
          # At this stage Outlook Host should already be created.
          $controllerNeedle = '        winrt::check_hresult(createdController->get_CoreWebView2(webview.put()));'
          $controllerReplacement = @'
                  winrt::check_hresult(createdController->get_CoreWebView2(webview.put()));
                  MBRememberOutlookWebViewController(createdController);
                  MBInstallOutlookMinHeightHook();
                  if (g_mbOutlookHost)
                  {
                      MBUpdateOutlookWideLayoutZoom(g_mbOutlookHost);
                  }
          '@

          if (-not $content.Contains($controllerNeedle)) {
            throw "Could not locate WebView controller initialization point."
          }
          $content = $content.Replace($controllerNeedle, $controllerReplacement)

          # V8 FIXED UI CSS.
          # IMPORTANT: the cssClass string is intentionally kept on one JavaScript line.
          # Raw newlines inside this quoted JS string would make ExecuteScript fail to parse.
          $pattern = '(?s)const cssClass = \\"\\.*?styleElement\.appendChild'
          $replacement = @'
          const cssClass = \"\
          [data-message-ad-id] { display: none !important; } #owaBuyMicrosoft365Btn_container { display: none !important; } button[role='tab'][value='other'] { flex: 0 0 auto !important; flex-shrink: 0 !important; width: auto !important; min-width: max-content !important; max-width: none !important; overflow: visible !important; white-space: nowrap !important; } button[role='tab'][value='other'] .fui-Tab__content, button[role='tab'][value='other'] .fui-Tab__content--reserved-space { white-space: nowrap !important; overflow: visible !important; text-overflow: clip !important; max-width: none !important; } div:has(> button[role='tab'][value='other']) { flex: 0 0 auto !important; flex-shrink: 0 !important; min-width: max-content !important; overflow: visible !important; }\";\n\
          styleElement.appendChild
          '@
          if (-not [regex]::IsMatch($content, $pattern)) {
            throw "Could not locate CSS injection block."
          }
          $content = [regex]::Replace($content, $pattern, $replacement, 1)

          # Disable the patcher's F12 interception.
          $content = $content.Replace(
            'const wchar_t* isF12Enabled = L"y_1A36CD25-E20F-4D0D-B1E6-3CC4307E1488";',
            'const wchar_t* isF12Enabled = L"n_1A36CD25-E20F-4D0D-B1E6-3CC4307E1488";'
          )

          # Keep the proven V3 WebView2 hook timing fix.
          $hookPattern = '(?s)HMODULE WINAPI HookLoadLibraryExW\(LPCWSTR lpLibFileName, HANDLE hFile, DWORD dwFlags\)\s*\{.*?\}\s*$'
          $hookReplacement = @'
          HMODULE WINAPI HookLoadLibraryExW(LPCWSTR lpLibFileName, HANDLE hFile, DWORD dwFlags)
          {
              auto result = ::LoadLibraryExW(lpLibFileName, hFile, dwFlags);

              static volatile LONG hookInstalled = 0;
              static volatile LONG hookInstalling = 0;

              if (::GetModuleHandleW(L"WebView2Loader.dll") != nullptr &&
                  ::InterlockedCompareExchange(&hookInstalled, 0, 0) == 0 &&
                  ::InterlockedCompareExchange(&hookInstalling, 1, 0) == 0)
              {
                  MH_STATUS status = MH_Initialize();
                  if (status != MH_OK && status != MH_ERROR_ALREADY_INITIALIZED)
                  {
                      DbgPrintf(L"NOP: Error initialising MinHook 0x%08X", status);
                      ::InterlockedExchange(&hookInstalling, 0);
                      return result;
                  }

                  status = MH_CreateHookApiEx(
                      L"WebView2Loader.dll",
                      "CreateCoreWebView2EnvironmentWithOptions",
                      &_CreateCoreWebView2EnvironmentWithOptions,
                      reinterpret_cast<void**>(&pCreateCoreWebView2EnvironmentWithOptions),
                      reinterpret_cast<void**>(&pCreateCoreWebView2EnvironmentWithOptionsTarget)
                  );

                  if (status != MH_OK && status != MH_ERROR_ALREADY_CREATED)
                  {
                      DbgPrintf(L"NOP: Error creating WebView2 hook 0x%08X", status);
                      ::InterlockedExchange(&hookInstalling, 0);
                      return result;
                  }

                  status = MH_EnableHook(MH_ALL_HOOKS);
                  if (status != MH_OK && status != MH_ERROR_ENABLED)
                  {
                      DbgPrintf(L"NOP: Error enabling WebView2 hook 0x%08X", status);
                      ::InterlockedExchange(&hookInstalling, 0);
                      return result;
                  }

                  ::InterlockedExchange(&hookInstalled, 1);
                  ::InterlockedExchange(&hookInstalling, 0);
                  DbgPrintf(L"NOP: WebView2 hook installed");
              }

              return result;
          }
          '@

          if (-not [regex]::IsMatch($content, $hookPattern)) {
            throw "Could not locate HookLoadLibraryExW in dllmain.cpp"
          }
          $content = [regex]::Replace($content, $hookPattern, $hookReplacement, 1)

          [System.IO.File]::WriteAllText(
            (Resolve-Path $path),
            $content,
            [System.Text.UTF8Encoding]::new($true)
          )

          Write-Host "V8.1 markers:"
          Select-String -Path $path -Pattern "data-message-ad-id"
          Select-String -Path $path -Pattern "owaBuyMicrosoft365Btn_container"
          Select-String -Path $path -Pattern "value='other'"
          Select-String -Path $path -Pattern "MB_WIDE_LAYOUT_REFERENCE_WIDTH"
          Select-String -Path $path -Pattern "MB_MIN_OUTLOOK_HEIGHT"
          Select-String -Path $path -Pattern "MB_MIN_WIDE_LAYOUT_ZOOM"
          Select-String -Path $path -Pattern "GetDpiForWindow"
          Select-String -Path $path -Pattern "GetClientRect"
          Select-String -Path $path -Pattern "put_ZoomFactor"
          Select-String -Path $path -Pattern "DPI-aware persistent folder-pane zoom enabled"
          Select-String -Path $path -Pattern "MBGetCaptionButtonHitTest"
          Select-String -Path $path -Pattern "WM_NCHITTEST"
          Select-String -Path $path -Pattern "HTCLOSE"
          Select-String -Path $path -Pattern "HTMAXBUTTON"
          Select-String -Path $path -Pattern "HTMINBUTTON"
          Select-String -Path $path -Pattern "WebView2 hook installed"

      - name: Restore native packages
        shell: cmd
        run: nuget restore NOP\worker\packages.config -PackagesDirectory packages -NonInteractive

      - name: Build x64 worker DLL
        shell: pwsh
        run: |
          $outDir = Join-Path $env:GITHUB_WORKSPACE "out"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          & msbuild "NOP\worker\worker.vcxproj" /m /p:Configuration=Release /p:Platform=x64 "/p:OutDir=$outDir\"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Prepare V8.1 package
        shell: pwsh
        run: |
          $package = Join-Path $env:GITHUB_WORKSPACE "package"
          $builtDll = Join-Path $env:GITHUB_WORKSPACE "out\dxgi.dll"

          if (-not (Test-Path $builtDll)) {
            throw "Built dxgi.dll was not found."
          }

          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item $builtDll (Join-Path $package "NewOutlookPatcher.dll") -Force

          $update = @'
          @echo off
          setlocal EnableExtensions
          title Outlook Ad Hider V8.1 - UPDATE

          fltmc >nul 2>&1
          if errorlevel 1 (
              powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Start-Process -FilePath $env:ComSpec -ArgumentList '/c','\"%~f0\"' -Verb RunAs"
              exit /b
          )

          echo.
          echo Closing New Outlook...
          taskkill /F /IM olk.exe /T >nul 2>&1

          for /L %%N in (1,1,20) do (
              tasklist /FI "IMAGENAME eq olk.exe" 2>nul | find /I "olk.exe" >nul
              if errorlevel 1 goto :copydll
              timeout /t 1 /nobreak >nul
          )

          :copydll
          echo Replacing V8 FIXED DLL with V8.1...
          for /L %%N in (1,1,10) do (
              copy /Y "%~dp0NewOutlookPatcher.dll" "%SystemRoot%\System32\NewOutlookPatcher.dll" >nul 2>&1
              if not errorlevel 1 goto :verify
              timeout /t 1 /nobreak >nul
          )

          echo.
          echo ERROR: DLL is still locked and could not be replaced.
          echo Restart Windows, then run this file again BEFORE opening Outlook.
          echo.
          pause
          exit /b 1

          :verify
          fc /b "%~dp0NewOutlookPatcher.dll" "%SystemRoot%\System32\NewOutlookPatcher.dll" >nul
          if errorlevel 1 (
              echo.
              echo ERROR: DLL verification failed.
              echo.
              pause
              exit /b 1
          )

          echo.
          echo ============================================
          echo   V8.1 DLL INSTALLED SUCCESSFULLY
          echo ============================================
          echo.
          echo V8.1 keeps the proven ad fix and the 500 px minimum height.
          echo It hides the Microsoft 365 purchase button and protects the Other tab.
          echo Folder-pane zoom is DPI-aware and uses the Outlook client width.
          echo V8.1 also repairs Minimize/Maximize/Close hit testing below 100%% zoom.
          echo.
          echo Opening Outlook...
          start "" explorer.exe "shell:AppsFolder\Microsoft.OutlookForWindows_8wekyb3d8bbwe!Microsoft.OutlookforWindows"
          echo.
          echo Try resizing Outlook horizontally and vertically with the mouse.
          echo.
          pause
          '@

          $readme = @'
          Outlook Ad Hider V8.1
          --------------------------
          Built from the proven V7 workflow.

          Ad hiding:
          - Keeps the proven selector unchanged:
            [data-message-ad-id] { display: none !important; }

          UI:
          - Hides the Microsoft 365 purchase/Premium button:
            #owaBuyMicrosoft365Btn_container
          - Prevents the Other tab from shrinking/clipping:
            button[role='tab'][value='other']
          - Does not depend on Bulgarian UI text.

          Folder pane:
          - Native minimum height remains 500 px.
          - Native horizontal resizing remains unrestricted.
          - Uses client-area width rather than outer-window width.
          - Converts device pixels to 96-DPI logical pixels using GetDpiForWindow.
          - This fixes the 125%/150% DPI mismatch that made the old threshold engage late.
          - Reference logical width: 960 px.
          - Minimum WebView2 ZoomFactor: 0.45.
          - Recalculates on WM_SIZE and WM_DPICHANGED.
          - Does not try to resurrect the folder tree after Outlook has unmounted it;
            instead it keeps Outlook in its wide/docked responsive layout.

          Window buttons:
          - At ZoomFactor 1.0 Outlook keeps its original behavior unchanged.
          - Below 1.0, V8.1 supplies DPI-aware native WM_NCHITTEST zones for the
            rightmost Minimize, Maximize/Restore, and Close buttons.
          - This prevents the visual X from acting like Maximize when the WebView
            content is zoomed to preserve the folder pane.
          - The top resize border remains available on non-maximized windows.

          JavaScript/CSS injection:
          - CSS is kept on one generated JavaScript string line.
          - This fixes the broken V8 build where raw newlines caused ExecuteScript
            to fail parsing, so none of the injected CSS was applied.

          Existing IFEO/AppVerifier settings stay unchanged.
          Chrome and Chrome cache are not touched.

          If anything behaves incorrectly, reinstall the saved V7 package.
          '@

          Set-Content -Path (Join-Path $package "UPDATE-Outlook-Ad-Hider-V8.1.cmd") -Value $update -Encoding ASCII
          Set-Content -Path (Join-Path $package "README.txt") -Value $readme -Encoding UTF8

      - name: Upload V8.1 package
        uses: actions/upload-artifact@v4
        with:
          name: Outlook-Ad-Hider-V8.1
          path: package
          if-no-files-found: error
