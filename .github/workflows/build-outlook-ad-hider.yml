name: Build Outlook Ad Hider V9

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Patch worker for Outlook V9
        shell: pwsh
        run: |
          $path = "NOP\worker\dllmain.cpp"
          $content = Get-Content -Path $path -Raw

          # V9 keeps the proven V5 native height fix: only lower Outlook Host's
          # WM_GETMINMAXINFO minimum TRACKING height to 500 px. Width is untouched.
          $nativeNeedle = @'
              OutputDebugStringW(L"\r\n");
          }

          // Example: MinHook signature for CreateCoreWebView2EnvironmentWithOptions
          '@

          $nativeReplacement = @'
              OutputDebugStringW(L"\r\n");
          }

          // MUSICBANTER V9 - allow the top-level Outlook Host window to be resized
          // vertically below Outlook's normal minimum. Width is intentionally untouched.
          static const LONG MB_MIN_OUTLOOK_HEIGHT = 500;
          static HWND g_mbOutlookHost = nullptr;
          static WNDPROC g_mbOriginalOutlookWndProc = nullptr;

          LRESULT CALLBACK MBOutlookHostWndProc(HWND hWnd, UINT uMsg, WPARAM wParam, LPARAM lParam)
          {
              WNDPROC original = g_mbOriginalOutlookWndProc;

              if (!original)
              {
                  return ::DefWindowProcW(hWnd, uMsg, wParam, lParam);
              }

              if (uMsg == WM_GETMINMAXINFO)
              {
                  // Let Outlook calculate its normal limits first.
                  LRESULT result = ::CallWindowProcW(original, hWnd, uMsg, wParam, lParam);

                  auto* info = reinterpret_cast<MINMAXINFO*>(lParam);
                  if (info != nullptr && info->ptMinTrackSize.y > MB_MIN_OUTLOOK_HEIGHT)
                  {
                      info->ptMinTrackSize.y = MB_MIN_OUTLOOK_HEIGHT;
                  }

                  return result;
              }

              return ::CallWindowProcW(original, hWnd, uMsg, wParam, lParam);
          }

          struct MBOutlookWindowSearch
          {
              DWORD processId;
              HWND window;
          };

          BOOL CALLBACK MBFindOutlookHostEnumProc(HWND hWnd, LPARAM lParam)
          {
              auto* search = reinterpret_cast<MBOutlookWindowSearch*>(lParam);
              if (!search)
              {
                  return TRUE;
              }

              DWORD processId = 0;
              ::GetWindowThreadProcessId(hWnd, &processId);
              if (processId != search->processId)
              {
                  return TRUE;
              }

              WCHAR className[128] = {};
              if (::GetClassNameW(hWnd, className, ARRAYSIZE(className)) <= 0)
              {
                  return TRUE;
              }

              if (::lstrcmpW(className, L"Outlook Host") == 0)
              {
                  search->window = hWnd;
                  return FALSE;
              }

              return TRUE;
          }

          void MBInstallOutlookMinHeightHook()
          {
              if (g_mbOutlookHost != nullptr && g_mbOriginalOutlookWndProc != nullptr)
              {
                  return;
              }

              MBOutlookWindowSearch search = { ::GetCurrentProcessId(), nullptr };
              ::EnumWindows(MBFindOutlookHostEnumProc, reinterpret_cast<LPARAM>(&search));

              if (!search.window)
              {
                  DbgPrintf(L"NOP V9: Outlook Host window not found yet");
                  return;
              }

              ::SetLastError(0);
              auto original = reinterpret_cast<WNDPROC>(
                  ::GetWindowLongPtrW(search.window, GWLP_WNDPROC)
              );

              if (!original && ::GetLastError() != ERROR_SUCCESS)
              {
                  DbgPrintf(L"NOP V9: GetWindowLongPtrW failed 0x%08X", ::GetLastError());
                  return;
              }

              // Publish the original proc before installing ours so the hook is safe
              // even if a window message arrives immediately after SetWindowLongPtrW.
              g_mbOriginalOutlookWndProc = original;

              ::SetLastError(0);
              auto previous = reinterpret_cast<WNDPROC>(
                  ::SetWindowLongPtrW(
                      search.window,
                      GWLP_WNDPROC,
                      reinterpret_cast<LONG_PTR>(MBOutlookHostWndProc)
                  )
              );

              if (!previous && ::GetLastError() != ERROR_SUCCESS)
              {
                  DbgPrintf(L"NOP V9: SetWindowLongPtrW failed 0x%08X", ::GetLastError());
                  g_mbOriginalOutlookWndProc = nullptr;
                  return;
              }

              if (previous)
              {
                  g_mbOriginalOutlookWndProc = previous;
              }

              g_mbOutlookHost = search.window;
              DbgPrintf(L"NOP V9: Outlook minimum height limited to %ld px", MB_MIN_OUTLOOK_HEIGHT);
          }

          // Example: MinHook signature for CreateCoreWebView2EnvironmentWithOptions
          '@

          if (-not $content.Contains($nativeNeedle)) {
            throw "Could not locate DbgPrintf insertion point."
          }
          $content = $content.Replace($nativeNeedle, $nativeReplacement)

          # Install the native window hook once the WebView controller exists.
          # At this stage Outlook Host should already be created.
          $controllerNeedle = '        winrt::check_hresult(createdController->get_CoreWebView2(webview.put()));'
          $controllerReplacement = @'
                  winrt::check_hresult(createdController->get_CoreWebView2(webview.put()));
                  MBInstallOutlookMinHeightHook();

                  // V9 - targeted Outlook responsive-layout patch.
                  // The Outlook bundle contains one helper that returns compact mode at
                  // <=918 px (or <=541 in a secondary layout, <=999 in portrait).
                  // MailLeftPane uses that helper to replace the real docked
                  // FolderPaneContainer with MailLeftPaneAsOverlay.
                  // Intercept only that webpack module before it executes and make the
                  // helper return false. No DOM removeChild blocking and no flyout click.
                  const wchar_t* mbDockedFolderScript = LR"MBJS(
          (() => {
            if (globalThis.__MB_DOCKED_FOLDER_V9__) return;
            globalThis.__MB_DOCKED_FOLDER_V9__ = true;

            try {
              const nativePush = Array.prototype.push;
              const arr = globalThis.webpackChunkOwa || [];
              let runtimePush = null;
              let patched = false;

              const patchChunk = (chunk) => {
                try {
                  const mods = chunk && chunk[1];
                  if (!mods || patched) return;

                  for (const id of Object.keys(mods)) {
                    const fn = mods[id];
                    if (typeof fn !== 'function') continue;

                    const src = Function.prototype.toString.call(fn);

                    // Exact responsive helper seen in Outlook:
                    // portrait <=999, secondary layout <=541, normal <=918.
                    if (
                      src.includes('startsWith("portrait")') &&
                      src.includes('<=999') &&
                      src.includes('<=541') &&
                      src.includes('<=918')
                    ) {
                      const match = src.match(/\.d\([^,]+,\{([\w$]+):\(\)=>/);
                      const exportName = match && match[1];
                      if (!exportName) continue;

                      mods[id] = function(module, exports, require) {
                        const neverCompactFolderPane = function() { return false; };
                        const spec = {};
                        spec[exportName] = () => neverCompactFolderPane;
                        require.d(exports, spec);
                      };

                      patched = true;
                      globalThis.__MB_DOCKED_FOLDER_V9_PATCHED__ = {
                        moduleId: String(id),
                        exportName: String(exportName)
                      };
                      break;
                    }
                  }
                } catch (e) {
                  globalThis.__MB_DOCKED_FOLDER_V9_ERROR__ = String(e);
                }
              };

              const wrapper = function(...args) {
                for (const item of args) patchChunk(item);
                if (runtimePush) return runtimePush.apply(arr, args);
                return nativePush.apply(arr, args);
              };

              // Webpack reads the old push while installing its runtime callback.
              // Before that assignment we deliberately expose the native push so the
              // runtime captures a non-recursive parent callback. After assignment,
              // every OWA chunk goes through our targeted patch first.
              Object.defineProperty(arr, 'push', {
                configurable: true,
                enumerable: false,
                get() { return runtimePush ? wrapper : nativePush; },
                set(fn) {
                  if (typeof fn === 'function') runtimePush = fn;
                }
              });

              globalThis.webpackChunkOwa = arr;
            } catch (e) {
              globalThis.__MB_DOCKED_FOLDER_V9_ERROR__ = String(e);
            }
          })();
          )MBJS";

                  HRESULT mbDockedHr = webview->AddScriptToExecuteOnDocumentCreated(
                      mbDockedFolderScript,
                      Microsoft::WRL::Callback<ICoreWebView2AddScriptToExecuteOnDocumentCreatedCompletedHandler>(
                          [](HRESULT errorCode, LPCWSTR id) -> HRESULT {
                              if (SUCCEEDED(errorCode)) {
                                  DbgPrintf(L"NOP V9: targeted docked-folder startup patch registered");
                              } else {
                                  DbgPrintf(L"NOP V9: targeted docked-folder startup patch failed 0x%08X", errorCode);
                              }
                              return S_OK;
                          }
                      ).Get()
                  );

                  if (FAILED(mbDockedHr)) {
                      DbgPrintf(L"NOP V9: AddScriptToExecuteOnDocumentCreated failed 0x%08X", mbDockedHr);
                  }
          '@

          if (-not $content.Contains($controllerNeedle)) {
            throw "Could not locate WebView controller initialization point."
          }
          $content = $content.Replace($controllerNeedle, $controllerReplacement)

          # Keep only the selector that was proven manually in this Outlook build.
          $pattern = '(?s)const cssClass = \\"\\.*?styleElement\.appendChild'
          $replacement = @'
          const cssClass = \"\
          [data-message-ad-id] { display: none !important; }\n\
          button[value='other'],\n\
          button[value='other'] .fui-Tab__content,\n\
          button[value='other'] .fui-Tab__content--reserved-space {\n\
            overflow: visible !important;\n\
            text-overflow: clip !important;\n\
            white-space: nowrap !important;\n\
          }\n\
          button[value='other'] {\n\
            min-width: 56px !important;\n\
            width: auto !important;\n\
            flex-shrink: 0 !important;\n\
          }\n\
          button[value='other'] .fui-Tab__content,\n\
          button[value='other'] .fui-Tab__content--reserved-space {\n\
            min-width: max-content !important;\n\
            width: max-content !important;\n\
          }\";\n\
          styleElement.appendChild
          '@
          if (-not [regex]::IsMatch($content, $pattern)) {
            throw "Could not locate CSS injection block."
          }
          $content = [regex]::Replace($content, $pattern, $replacement, 1)

          # Disable the patcher's F12 interception.
          $content = $content.Replace(
            'const wchar_t* isF12Enabled = L"y_1A36CD25-E20F-4D0D-B1E6-3CC4307E1488";',
            'const wchar_t* isF12Enabled = L"n_1A36CD25-E20F-4D0D-B1E6-3CC4307E1488";'
          )

          # Keep the proven V3 WebView2 hook timing fix.
          $hookPattern = '(?s)HMODULE WINAPI HookLoadLibraryExW\(LPCWSTR lpLibFileName, HANDLE hFile, DWORD dwFlags\)\s*\{.*?\}\s*$'
          $hookReplacement = @'
          HMODULE WINAPI HookLoadLibraryExW(LPCWSTR lpLibFileName, HANDLE hFile, DWORD dwFlags)
          {
              auto result = ::LoadLibraryExW(lpLibFileName, hFile, dwFlags);

              static volatile LONG hookInstalled = 0;
              static volatile LONG hookInstalling = 0;

              if (::GetModuleHandleW(L"WebView2Loader.dll") != nullptr &&
                  ::InterlockedCompareExchange(&hookInstalled, 0, 0) == 0 &&
                  ::InterlockedCompareExchange(&hookInstalling, 1, 0) == 0)
              {
                  MH_STATUS status = MH_Initialize();
                  if (status != MH_OK && status != MH_ERROR_ALREADY_INITIALIZED)
                  {
                      DbgPrintf(L"NOP: Error initialising MinHook 0x%08X", status);
                      ::InterlockedExchange(&hookInstalling, 0);
                      return result;
                  }

                  status = MH_CreateHookApiEx(
                      L"WebView2Loader.dll",
                      "CreateCoreWebView2EnvironmentWithOptions",
                      &_CreateCoreWebView2EnvironmentWithOptions,
                      reinterpret_cast<void**>(&pCreateCoreWebView2EnvironmentWithOptions),
                      reinterpret_cast<void**>(&pCreateCoreWebView2EnvironmentWithOptionsTarget)
                  );

                  if (status != MH_OK && status != MH_ERROR_ALREADY_CREATED)
                  {
                      DbgPrintf(L"NOP: Error creating WebView2 hook 0x%08X", status);
                      ::InterlockedExchange(&hookInstalling, 0);
                      return result;
                  }

                  status = MH_EnableHook(MH_ALL_HOOKS);
                  if (status != MH_OK && status != MH_ERROR_ENABLED)
                  {
                      DbgPrintf(L"NOP: Error enabling WebView2 hook 0x%08X", status);
                      ::InterlockedExchange(&hookInstalling, 0);
                      return result;
                  }

                  ::InterlockedExchange(&hookInstalled, 1);
                  ::InterlockedExchange(&hookInstalling, 0);
                  DbgPrintf(L"NOP: WebView2 hook installed");
              }

              return result;
          }
          '@

          if (-not [regex]::IsMatch($content, $hookPattern)) {
            throw "Could not locate HookLoadLibraryExW in dllmain.cpp"
          }
          $content = [regex]::Replace($content, $hookPattern, $hookReplacement, 1)

          [System.IO.File]::WriteAllText(
            (Resolve-Path $path),
            $content,
            [System.Text.UTF8Encoding]::new($true)
          )

          Write-Host "V9 markers:"
          Select-String -Path $path -Pattern "data-message-ad-id"
          Select-String -Path $path -Pattern "__MB_DOCKED_FOLDER_V9__"
          Select-String -Path $path -Pattern "AddScriptToExecuteOnDocumentCreated"
          Select-String -Path $path -Pattern "button\[value='other'\]"
          Select-String -Path $path -Pattern "MB_MIN_OUTLOOK_HEIGHT"
          Select-String -Path $path -Pattern "Outlook minimum height limited"
          Select-String -Path $path -Pattern "WebView2 hook installed"

      - name: Restore native packages
        shell: cmd
        run: nuget restore NOP\worker\packages.config -PackagesDirectory packages -NonInteractive

      - name: Build x64 worker DLL
        shell: pwsh
        run: |
          $outDir = Join-Path $env:GITHUB_WORKSPACE "out"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          & msbuild "NOP\worker\worker.vcxproj" /m /p:Configuration=Release /p:Platform=x64 "/p:OutDir=$outDir\"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Prepare V9 package
        shell: pwsh
        run: |
          $package = Join-Path $env:GITHUB_WORKSPACE "package"
          $builtDll = Join-Path $env:GITHUB_WORKSPACE "out\dxgi.dll"

          if (-not (Test-Path $builtDll)) {
            throw "Built dxgi.dll was not found."
          }

          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item $builtDll (Join-Path $package "NewOutlookPatcher.dll") -Force

          $update = @'
          @echo off
          setlocal EnableExtensions
          title Outlook Ad Hider V9 - UPDATE

          fltmc >nul 2>&1
          if errorlevel 1 (
              powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Start-Process -FilePath $env:ComSpec -ArgumentList '/c','\"%~f0\"' -Verb RunAs"
              exit /b
          )

          echo.
          echo Closing New Outlook...
          taskkill /F /IM olk.exe /T >nul 2>&1

          for /L %%N in (1,1,20) do (
              tasklist /FI "IMAGENAME eq olk.exe" 2>nul | find /I "olk.exe" >nul
              if errorlevel 1 goto :copydll
              timeout /t 1 /nobreak >nul
          )

          :copydll
          echo Replacing current DLL with V9...
          for /L %%N in (1,1,10) do (
              copy /Y "%~dp0NewOutlookPatcher.dll" "%SystemRoot%\System32\NewOutlookPatcher.dll" >nul 2>&1
              if not errorlevel 1 goto :verify
              timeout /t 1 /nobreak >nul
          )

          echo.
          echo ERROR: DLL is still locked and could not be replaced.
          echo Restart Windows, then run this file again BEFORE opening Outlook.
          echo.
          pause
          exit /b 1

          :verify
          fc /b "%~dp0NewOutlookPatcher.dll" "%SystemRoot%\System32\NewOutlookPatcher.dll" >nul
          if errorlevel 1 (
              echo.
              echo ERROR: DLL verification failed.
              echo.
              pause
              exit /b 1
          )

          echo.
          echo ============================================
          echo   V9 DLL INSTALLED SUCCESSFULLY
          echo ============================================
          echo.
          echo V9 keeps the ad fix and 500 px minimum height.
          echo V9 also forces the REAL docked folder pane to stay
          echo in desktop mode below Outlook's 918 px breakpoint,
          echo and fixes the clipped Other tab text.
          echo.
          echo Opening Outlook...
          start "" explorer.exe "shell:AppsFolder\Microsoft.OutlookForWindows_8wekyb3d8bbwe!Microsoft.OutlookforWindows"
          echo.
          echo Resize Outlook horizontally and vertically with the mouse.
          echo.
          pause
          '@

          $readme = @'
          Outlook Ad Hider V9
          --------------------
          Base: the proven V5 native-height behavior.

          V9 fixes four things:
          1. Hides the New Outlook message-list advertising row.
          2. Keeps the working 500 px minimum window height.
          3. Keeps the REAL docked FolderPaneContainer instead of Outlook switching
             to MailLeftPaneAsOverlay when its responsive helper crosses 918 px.
          4. Forces the Bulgarian "Other" tab text to remain fully visible even
             while that tab is unselected.

          The folder-pane fix is targeted at the exact Outlook webpack helper whose
          logic is portrait<=999 / secondary<=541 / normal<=918. V9 replaces only
          that helper module before Outlook React starts, making compact-folder mode
          return false. It does NOT block Node.removeChild and does NOT click the
          hamburger/flyout menu.

          Width is not constrained. Chrome and Chrome cache are not touched.

          Optional diagnostics in DevTools Console:
          window.__MB_DOCKED_FOLDER_V9__
          window.__MB_DOCKED_FOLDER_V9_PATCHED__
          '@

          Set-Content -Path (Join-Path $package "UPDATE-Outlook-Ad-Hider-V9.cmd") -Value $update -Encoding ASCII
          Set-Content -Path (Join-Path $package "README.txt") -Value $readme -Encoding UTF8

      - name: Upload V9 package
        uses: actions/upload-artifact@v4
        with:
          name: Outlook-Ad-Hider-V9
          path: package
          if-no-files-found: error
