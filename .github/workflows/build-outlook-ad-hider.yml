name: Build Outlook Ad Hider DLL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Replace worker with Outlook 1.2026 ad-only patch
        shell: powershell
        run: |
          $b64 = @'

'@
          [IO.File]::WriteAllBytes(
            "$env:GITHUB_WORKSPACE\NOP\worker\dllmain.cpp",
            [Convert]::FromBase64String($b64)
          )

      - name: Restore native packages
        shell: cmd
        run: nuget restore NOP\worker\packages.config -PackagesDirectory packages -NonInteractive

      - name: Build x64 worker DLL
        shell: cmd
        run: msbuild NOP\worker\worker.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:OutDir="%GITHUB_WORKSPACE%\out\"

      - name: Prepare ready package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\package" | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\out\dxgi.dll" "$env:GITHUB_WORKSPACE\package\NewOutlookPatcher.dll"

          @'
@echo off
setlocal EnableExtensions
title Outlook Ad Hider - INSTALL

net session >nul 2>&1
if not "%errorlevel%"=="0" (
  powershell -NoProfile -WindowStyle Hidden -Command "Start-Process -FilePath '%~f0' -Verb RunAs"
  exit /b
)

if not exist "%~dp0NewOutlookPatcher.dll" (
  echo Missing NewOutlookPatcher.dll
  pause
  exit /b 1
)

taskkill /F /IM olk.exe /T >nul 2>&1

copy /Y "%~dp0NewOutlookPatcher.dll" "%SystemRoot%\System32\NewOutlookPatcher.dll" >nul
if errorlevel 1 (
  echo Failed to copy DLL to System32.
  pause
  exit /b 1
)

powershell -NoProfile -ExecutionPolicy Bypass -Command ^
"$base=[Microsoft.Win32.RegistryKey]::OpenBaseKey([Microsoft.Win32.RegistryHive]::LocalMachine,[Microsoft.Win32.RegistryView]::Registry64);" ^
"$p='SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\olk.exe';" ^
"$k=$base.CreateSubKey($p);" ^
"$g=$k.GetValue('GlobalFlag',$null);" ^
"if($null -eq $g){$g=0};" ^
"$k.SetValue('GlobalFlag',([int]$g -bor 0x100),[Microsoft.Win32.RegistryValueKind]::DWord);" ^
"$v=[string]$k.GetValue('VerifierDlls','');" ^
"if($v -notmatch '(^|\s)NewOutlookPatcher\.dll($|\s)'){$v=($v+' NewOutlookPatcher.dll').Trim()};" ^
"$k.SetValue('VerifierDlls',$v,[Microsoft.Win32.RegistryValueKind]::String);" ^
"$k.Close();$base.Close()"

echo.
echo Outlook ad hider installed.
echo Opening Outlook normally...
start "" explorer.exe "shell:AppsFolder\Microsoft.OutlookForWindows_8wekyb3d8bbwe!Microsoft.OutlookforWindows"
echo.
pause
'@ | Set-Content -Encoding ASCII "$env:GITHUB_WORKSPACE\package\INSTALL-Outlook-Ad-Hider.cmd"

          @'
@echo off
setlocal EnableExtensions
title Outlook Ad Hider - UNINSTALL

net session >nul 2>&1
if not "%errorlevel%"=="0" (
  powershell -NoProfile -WindowStyle Hidden -Command "Start-Process -FilePath '%~f0' -Verb RunAs"
  exit /b
)

taskkill /F /IM olk.exe /T >nul 2>&1

powershell -NoProfile -ExecutionPolicy Bypass -Command ^
"$base=[Microsoft.Win32.RegistryKey]::OpenBaseKey([Microsoft.Win32.RegistryHive]::LocalMachine,[Microsoft.Win32.RegistryView]::Registry64);" ^
"$p='SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\olk.exe';" ^
"$k=$base.OpenSubKey($p,$true);" ^
"if($k){" ^
" $v=[string]$k.GetValue('VerifierDlls','');" ^
" $parts=@($v -split '\s+' | Where-Object {$_ -and $_ -ne 'NewOutlookPatcher.dll'});" ^
" if($parts.Count -eq 0){$k.DeleteValue('VerifierDlls',$false);$g=$k.GetValue('GlobalFlag',$null);if($null -ne $g){$n=[int]$g -band (-bnot 0x100);if($n -eq 0){$k.DeleteValue('GlobalFlag',$false)}else{$k.SetValue('GlobalFlag',$n,[Microsoft.Win32.RegistryValueKind]::DWord)}}}else{$k.SetValue('VerifierDlls',($parts -join ' '),[Microsoft.Win32.RegistryValueKind]::String)};" ^
" $k.Close()" ^
"};" ^
"$base.Close()"

del /F /Q "%SystemRoot%\System32\NewOutlookPatcher.dll" >nul 2>&1

echo.
echo Outlook ad hider uninstalled.
start "" explorer.exe "shell:AppsFolder\Microsoft.OutlookForWindows_8wekyb3d8bbwe!Microsoft.OutlookforWindows"
echo.
pause
'@ | Set-Content -Encoding ASCII "$env:GITHUB_WORKSPACE\package\UNINSTALL-Outlook-Ad-Hider.cmd"

          @'
This build is based on nicbedford/NewOutlookPatcher hooking updates.
Customization: only the Outlook message-list ad row is hidden.
Selector: [data-message-ad-id]
No Chrome files or Chrome cache are touched.
'@ | Set-Content -Encoding UTF8 "$env:GITHUB_WORKSPACE\package\README.txt"

      - name: Upload ready package
        uses: actions/upload-artifact@v4
        with:
          name: Outlook-Ad-Hider-Ready
          path: package
          if-no-files-found: error
