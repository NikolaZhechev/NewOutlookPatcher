name: Build Outlook Ad Hider V7

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Patch worker for Outlook V7
        shell: pwsh
        run: |
          $path = "NOP\worker\dllmain.cpp"
          $content = Get-Content -Path $path -Raw

          # V7 native/window WebView2 fix:
          # - keep the proven V5 500 px minimum-height change;
          # - stop forcing the V6 943 px native minimum width;
          # - below 943 px, dynamically lower the WebView2 host zoom so the page keeps
          #   approximately the same logical CSS viewport width. This lets Outlook's own
          #   responsive React code remain in its real docked FolderPaneContainer layout
          #   instead of switching NavigationPane from Ni89i to a7Ps_ and unmounting YYA9V.
          $nativeNeedle = @'
              OutputDebugStringW(L"\r\n");
          }

          // Example: MinHook signature for CreateCoreWebView2EnvironmentWithOptions
          '@

          $nativeReplacement = @'
              OutputDebugStringW(L"\r\n");
          }

          // MUSICBANTER V7 - keep the classic docked folder pane by preserving Outlook's
          // wide logical WebView layout while allowing the native window itself to narrow.
          static const LONG MB_WIDE_LAYOUT_REFERENCE_WIDTH = 943;
          static const LONG MB_MIN_OUTLOOK_HEIGHT = 500;
          static const double MB_MIN_WIDE_LAYOUT_ZOOM = 0.70;
          static HWND g_mbOutlookHost = nullptr;
          static WNDPROC g_mbOriginalOutlookWndProc = nullptr;
          static ICoreWebView2Controller* g_mbWebViewController = nullptr;
          static double g_mbLastZoom = -1.0;

          void MBUpdateOutlookWideLayoutZoom(HWND hWnd)
          {
              if (!hWnd || !g_mbWebViewController)
              {
                  return;
              }

              RECT rect = {};
              if (!::GetWindowRect(hWnd, &rect))
              {
                  return;
              }

              LONG width = rect.right - rect.left;
              if (width <= 0)
              {
                  return;
              }

              double zoom = 1.0;
              if (width < MB_WIDE_LAYOUT_REFERENCE_WIDTH)
              {
                  zoom = static_cast<double>(width) /
                         static_cast<double>(MB_WIDE_LAYOUT_REFERENCE_WIDTH);
              }

              if (zoom < MB_MIN_WIDE_LAYOUT_ZOOM)
              {
                  zoom = MB_MIN_WIDE_LAYOUT_ZOOM;
              }
              if (zoom > 1.0)
              {
                  zoom = 1.0;
              }

              double delta = zoom - g_mbLastZoom;
              if (delta < 0.0)
              {
                  delta = -delta;
              }

              if (g_mbLastZoom < 0.0 || delta >= 0.002)
              {
                  HRESULT hr = g_mbWebViewController->put_ZoomFactor(zoom);
                  if (SUCCEEDED(hr))
                  {
                      g_mbLastZoom = zoom;
                  }
                  else
                  {
                      DbgPrintf(L"NOP V7: put_ZoomFactor failed 0x%08X", hr);
                  }
              }
          }

          void MBRememberOutlookWebViewController(ICoreWebView2Controller* controller)
          {
              if (!controller || g_mbWebViewController)
              {
                  return;
              }

              HWND parentWindow = nullptr;
              if (FAILED(controller->get_ParentWindow(&parentWindow)) || !parentWindow)
              {
                  return;
              }

              HWND root = ::GetAncestor(parentWindow, GA_ROOT);
              if (!root)
              {
                  root = parentWindow;
              }

              WCHAR className[128] = {};
              if (::GetClassNameW(root, className, ARRAYSIZE(className)) <= 0 ||
                  ::lstrcmpW(className, L"Outlook Host") != 0)
              {
                  return;
              }

              controller->AddRef();
              g_mbWebViewController = controller;
              DbgPrintf(L"NOP V7: main Outlook WebView2 controller captured");
          }

          LRESULT CALLBACK MBOutlookHostWndProc(HWND hWnd, UINT uMsg, WPARAM wParam, LPARAM lParam)
          {
              WNDPROC original = g_mbOriginalOutlookWndProc;

              if (!original)
              {
                  return ::DefWindowProcW(hWnd, uMsg, wParam, lParam);
              }

              if (uMsg == WM_GETMINMAXINFO)
              {
                  LRESULT result = ::CallWindowProcW(original, hWnd, uMsg, wParam, lParam);

                  auto* info = reinterpret_cast<MINMAXINFO*>(lParam);
                  if (info != nullptr && info->ptMinTrackSize.y > MB_MIN_OUTLOOK_HEIGHT)
                  {
                      info->ptMinTrackSize.y = MB_MIN_OUTLOOK_HEIGHT;
                  }

                  return result;
              }

              if (uMsg == WM_SIZE)
              {
                  LRESULT result = ::CallWindowProcW(original, hWnd, uMsg, wParam, lParam);
                  MBUpdateOutlookWideLayoutZoom(hWnd);
                  return result;
              }

              return ::CallWindowProcW(original, hWnd, uMsg, wParam, lParam);
          }

          struct MBOutlookWindowSearch
          {
              DWORD processId;
              HWND window;
          };

          BOOL CALLBACK MBFindOutlookHostEnumProc(HWND hWnd, LPARAM lParam)
          {
              auto* search = reinterpret_cast<MBOutlookWindowSearch*>(lParam);
              if (!search)
              {
                  return TRUE;
              }

              DWORD processId = 0;
              ::GetWindowThreadProcessId(hWnd, &processId);
              if (processId != search->processId)
              {
                  return TRUE;
              }

              WCHAR className[128] = {};
              if (::GetClassNameW(hWnd, className, ARRAYSIZE(className)) <= 0)
              {
                  return TRUE;
              }

              if (::lstrcmpW(className, L"Outlook Host") == 0)
              {
                  search->window = hWnd;
                  return FALSE;
              }

              return TRUE;
          }

          void MBInstallOutlookMinHeightHook()
          {
              if (g_mbOutlookHost != nullptr && g_mbOriginalOutlookWndProc != nullptr)
              {
                  MBUpdateOutlookWideLayoutZoom(g_mbOutlookHost);
                  return;
              }

              MBOutlookWindowSearch search = { ::GetCurrentProcessId(), nullptr };
              ::EnumWindows(MBFindOutlookHostEnumProc, reinterpret_cast<LPARAM>(&search));

              if (!search.window)
              {
                  DbgPrintf(L"NOP V7: Outlook Host window not found yet");
                  return;
              }

              ::SetLastError(0);
              auto original = reinterpret_cast<WNDPROC>(
                  ::GetWindowLongPtrW(search.window, GWLP_WNDPROC)
              );

              if (!original && ::GetLastError() != ERROR_SUCCESS)
              {
                  DbgPrintf(L"NOP V7: GetWindowLongPtrW failed 0x%08X", ::GetLastError());
                  return;
              }

              g_mbOriginalOutlookWndProc = original;

              ::SetLastError(0);
              auto previous = reinterpret_cast<WNDPROC>(
                  ::SetWindowLongPtrW(
                      search.window,
                      GWLP_WNDPROC,
                      reinterpret_cast<LONG_PTR>(MBOutlookHostWndProc)
                  )
              );

              if (!previous && ::GetLastError() != ERROR_SUCCESS)
              {
                  DbgPrintf(L"NOP V7: SetWindowLongPtrW failed 0x%08X", ::GetLastError());
                  g_mbOriginalOutlookWndProc = nullptr;
                  return;
              }

              if (previous)
              {
                  g_mbOriginalOutlookWndProc = previous;
              }

              g_mbOutlookHost = search.window;
              DbgPrintf(L"NOP V7: 500 px min height + adaptive WebView2 wide-layout zoom enabled");
              MBUpdateOutlookWideLayoutZoom(g_mbOutlookHost);
          }

          // Example: MinHook signature for CreateCoreWebView2EnvironmentWithOptions
          '@

          if (-not $content.Contains($nativeNeedle)) {
            throw "Could not locate DbgPrintf insertion point."
          }
          $content = $content.Replace($nativeNeedle, $nativeReplacement)

          # Install the native window hook once the WebView controller exists.
          # At this stage Outlook Host should already be created.
          $controllerNeedle = '        winrt::check_hresult(createdController->get_CoreWebView2(webview.put()));'
          $controllerReplacement = @'
                  winrt::check_hresult(createdController->get_CoreWebView2(webview.put()));
                  MBRememberOutlookWebViewController(createdController);
                  MBInstallOutlookMinHeightHook();
                  if (g_mbOutlookHost)
                  {
                      MBUpdateOutlookWideLayoutZoom(g_mbOutlookHost);
                  }
          '@

          if (-not $content.Contains($controllerNeedle)) {
            throw "Could not locate WebView controller initialization point."
          }
          $content = $content.Replace($controllerNeedle, $controllerReplacement)

          # Keep only the selector that was proven manually in this Outlook build.
          $pattern = '(?s)const cssClass = \\"\\.*?styleElement\.appendChild'
          $replacement = @'
          const cssClass = \"\
          [data-message-ad-id] { display: none !important; }\";\n\
          styleElement.appendChild
          '@
          if (-not [regex]::IsMatch($content, $pattern)) {
            throw "Could not locate CSS injection block."
          }
          $content = [regex]::Replace($content, $pattern, $replacement, 1)

          # Disable the patcher's F12 interception.
          $content = $content.Replace(
            'const wchar_t* isF12Enabled = L"y_1A36CD25-E20F-4D0D-B1E6-3CC4307E1488";',
            'const wchar_t* isF12Enabled = L"n_1A36CD25-E20F-4D0D-B1E6-3CC4307E1488";'
          )

          # Keep the proven V3 WebView2 hook timing fix.
          $hookPattern = '(?s)HMODULE WINAPI HookLoadLibraryExW\(LPCWSTR lpLibFileName, HANDLE hFile, DWORD dwFlags\)\s*\{.*?\}\s*$'
          $hookReplacement = @'
          HMODULE WINAPI HookLoadLibraryExW(LPCWSTR lpLibFileName, HANDLE hFile, DWORD dwFlags)
          {
              auto result = ::LoadLibraryExW(lpLibFileName, hFile, dwFlags);

              static volatile LONG hookInstalled = 0;
              static volatile LONG hookInstalling = 0;

              if (::GetModuleHandleW(L"WebView2Loader.dll") != nullptr &&
                  ::InterlockedCompareExchange(&hookInstalled, 0, 0) == 0 &&
                  ::InterlockedCompareExchange(&hookInstalling, 1, 0) == 0)
              {
                  MH_STATUS status = MH_Initialize();
                  if (status != MH_OK && status != MH_ERROR_ALREADY_INITIALIZED)
                  {
                      DbgPrintf(L"NOP: Error initialising MinHook 0x%08X", status);
                      ::InterlockedExchange(&hookInstalling, 0);
                      return result;
                  }

                  status = MH_CreateHookApiEx(
                      L"WebView2Loader.dll",
                      "CreateCoreWebView2EnvironmentWithOptions",
                      &_CreateCoreWebView2EnvironmentWithOptions,
                      reinterpret_cast<void**>(&pCreateCoreWebView2EnvironmentWithOptions),
                      reinterpret_cast<void**>(&pCreateCoreWebView2EnvironmentWithOptionsTarget)
                  );

                  if (status != MH_OK && status != MH_ERROR_ALREADY_CREATED)
                  {
                      DbgPrintf(L"NOP: Error creating WebView2 hook 0x%08X", status);
                      ::InterlockedExchange(&hookInstalling, 0);
                      return result;
                  }

                  status = MH_EnableHook(MH_ALL_HOOKS);
                  if (status != MH_OK && status != MH_ERROR_ENABLED)
                  {
                      DbgPrintf(L"NOP: Error enabling WebView2 hook 0x%08X", status);
                      ::InterlockedExchange(&hookInstalling, 0);
                      return result;
                  }

                  ::InterlockedExchange(&hookInstalled, 1);
                  ::InterlockedExchange(&hookInstalling, 0);
                  DbgPrintf(L"NOP: WebView2 hook installed");
              }

              return result;
          }
          '@

          if (-not [regex]::IsMatch($content, $hookPattern)) {
            throw "Could not locate HookLoadLibraryExW in dllmain.cpp"
          }
          $content = [regex]::Replace($content, $hookPattern, $hookReplacement, 1)

          [System.IO.File]::WriteAllText(
            (Resolve-Path $path),
            $content,
            [System.Text.UTF8Encoding]::new($true)
          )

          Write-Host "V7 markers:"
          Select-String -Path $path -Pattern "data-message-ad-id"
          Select-String -Path $path -Pattern "MB_WIDE_LAYOUT_REFERENCE_WIDTH"
          Select-String -Path $path -Pattern "MB_MIN_OUTLOOK_HEIGHT"
          Select-String -Path $path -Pattern "put_ZoomFactor"
          Select-String -Path $path -Pattern "adaptive WebView2 wide-layout zoom enabled"
          Select-String -Path $path -Pattern "WebView2 hook installed"

      - name: Restore native packages
        shell: cmd
        run: nuget restore NOP\worker\packages.config -PackagesDirectory packages -NonInteractive

      - name: Build x64 worker DLL
        shell: pwsh
        run: |
          $outDir = Join-Path $env:GITHUB_WORKSPACE "out"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          & msbuild "NOP\worker\worker.vcxproj" /m /p:Configuration=Release /p:Platform=x64 "/p:OutDir=$outDir\"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Prepare V7 package
        shell: pwsh
        run: |
          $package = Join-Path $env:GITHUB_WORKSPACE "package"
          $builtDll = Join-Path $env:GITHUB_WORKSPACE "out\dxgi.dll"

          if (-not (Test-Path $builtDll)) {
            throw "Built dxgi.dll was not found."
          }

          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item $builtDll (Join-Path $package "NewOutlookPatcher.dll") -Force

          $update = @'
          @echo off
          setlocal EnableExtensions
          title Outlook Ad Hider V7 - UPDATE

          fltmc >nul 2>&1
          if errorlevel 1 (
              powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Start-Process -FilePath $env:ComSpec -ArgumentList '/c','\"%~f0\"' -Verb RunAs"
              exit /b
          )

          echo.
          echo Closing New Outlook...
          taskkill /F /IM olk.exe /T >nul 2>&1

          for /L %%N in (1,1,20) do (
              tasklist /FI "IMAGENAME eq olk.exe" 2>nul | find /I "olk.exe" >nul
              if errorlevel 1 goto :copydll
              timeout /t 1 /nobreak >nul
          )

          :copydll
          echo Replacing V6 DLL with V7...
          for /L %%N in (1,1,10) do (
              copy /Y "%~dp0NewOutlookPatcher.dll" "%SystemRoot%\System32\NewOutlookPatcher.dll" >nul 2>&1
              if not errorlevel 1 goto :verify
              timeout /t 1 /nobreak >nul
          )

          echo.
          echo ERROR: DLL is still locked and could not be replaced.
          echo Restart Windows, then run this file again BEFORE opening Outlook.
          echo.
          pause
          exit /b 1

          :verify
          fc /b "%~dp0NewOutlookPatcher.dll" "%SystemRoot%\System32\NewOutlookPatcher.dll" >nul
          if errorlevel 1 (
              echo.
              echo ERROR: DLL verification failed.
              echo.
              pause
              exit /b 1
          )

          echo.
          echo ============================================
          echo   V7 DLL INSTALLED SUCCESSFULLY
          echo ============================================
          echo.
          echo V7 keeps the V3 ad fix and the V5 500 px minimum height.
          echo Horizontal resizing is free again. Below 943 px V7 dynamically
          echo zooms the Outlook WebView just enough to keep its wide docked layout.
          echo.
          echo Opening Outlook...
          start "" explorer.exe "shell:AppsFolder\Microsoft.OutlookForWindows_8wekyb3d8bbwe!Microsoft.OutlookforWindows"
          echo.
          echo Try resizing Outlook horizontally and vertically with the mouse.
          echo.
          pause
          '@

          $readme = @'
          Outlook Ad Hider V7
          --------------------
          Base: proven V3 ad fix + working V5 500 px minimum-height fix.

          Keeps the proven ad rule:
          [data-message-ad-id] { display: none !important; }

          Folder-pane fix:
          - Does NOT block React removeChild.
          - Does NOT use the hamburger flyout/overlay.
          - Does NOT spoof matchMedia or ResizeObserver.
          - Removes V6's artificial 943 px native minimum width.
          - When the Outlook Host becomes narrower than 943 px, V7 lowers the
            WebView2 host ZoomFactor proportionally (minimum 0.70).
          - WebView2 therefore keeps approximately the same logical CSS viewport
            width, so Outlook should remain in its own wide/docked NavigationPane
            state instead of switching Ni89i -> a7Ps_ and unmounting YYA9V.
          - At 943 px and wider, ZoomFactor is exactly 1.0.

          This is a native WebView2 layout fix rather than DOM surgery. Microsoft
          documents that changing ZoomFactor can change window.innerWidth and page
          layout, which is the behavior V7 intentionally uses.

          Existing IFEO/AppVerifier settings stay unchanged.
          Chrome and Chrome cache are not touched.

          If Outlook behaves incorrectly, reinstall the saved V6 or V3 package.
          '@

          Set-Content -Path (Join-Path $package "UPDATE-Outlook-Ad-Hider-V7.cmd") -Value $update -Encoding ASCII
          Set-Content -Path (Join-Path $package "README.txt") -Value $readme -Encoding UTF8

      - name: Upload V7 package
        uses: actions/upload-artifact@v4
        with:
          name: Outlook-Ad-Hider-V7
          path: package
          if-no-files-found: error
