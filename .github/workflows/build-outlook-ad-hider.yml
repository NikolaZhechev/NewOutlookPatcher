name: Build Outlook Ad Hider DLL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Patch worker for Outlook ad row only
        shell: pwsh
        run: |
          $path = "NOP\worker\dllmain.cpp"
          $lines = Get-Content -Path $path

          $start = -1
          $end = -1

          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($start -lt 0 -and $lines[$i] -match 'const cssClass =') {
              $start = $i
            }
            if ($lines[$i] -match 'styleElement\.appendChild') {
              $end = $i
              break
            }
          }

          if ($start -lt 0 -or $end -lt 0 -or $end -le $start) {
            throw "Could not locate CSS block in dllmain.cpp"
          }

          $before = @()
          if ($start -gt 0) {
            $before = $lines[0..($start - 1)]
          }

          $after = $lines[$end..($lines.Count - 1)]

          $newCss = @(
            'const cssClass = \"\'
            '[data-message-ad-id] { display: none !important; }\";\n\'
          )

          $out = @()
          $out += $before
          $out += $newCss
          $out += $after

          [System.IO.File]::WriteAllLines(
            (Resolve-Path $path),
            $out,
            [System.Text.UTF8Encoding]::new($true)
          )

          $content = Get-Content -Path $path -Raw
          $content = $content.Replace(
            'const wchar_t* isF12Enabled = L"y_1A36CD25-E20F-4D0D-B1E6-3CC4307E1488";',
            'const wchar_t* isF12Enabled = L"n_1A36CD25-E20F-4D0D-B1E6-3CC4307E1488";'
          )
          [System.IO.File]::WriteAllText(
            (Resolve-Path $path),
            $content,
            [System.Text.UTF8Encoding]::new($true)
          )

          Write-Host "Patched CSS:"
          Select-String -Path $path -Pattern "data-message-ad-id"

      - name: Restore native packages
        shell: cmd
        run: nuget restore NOP\worker\packages.config -PackagesDirectory packages -NonInteractive

      - name: Build x64 worker DLL
        shell: pwsh
        run: |
          $outDir = Join-Path $env:GITHUB_WORKSPACE "out"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          & msbuild "NOP\worker\worker.vcxproj" /m /p:Configuration=Release /p:Platform=x64 "/p:OutDir=$outDir\"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Prepare ready package
        shell: pwsh
        run: |
          $package = Join-Path $env:GITHUB_WORKSPACE "package"
          $builtDll = Join-Path $env:GITHUB_WORKSPACE "out\dxgi.dll"

          if (-not (Test-Path $builtDll)) {
            throw "Built dxgi.dll was not found."
          }

          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item $builtDll (Join-Path $package "NewOutlookPatcher.dll") -Force

          $install = @"
          @echo off
          setlocal EnableExtensions
          title Outlook Ad Hider - INSTALL

          net session >nul 2>&1
          if not "%errorlevel%"=="0" (
            powershell -NoProfile -WindowStyle Hidden -Command "Start-Process -FilePath '%~f0' -Verb RunAs"
            exit /b
          )

          if not exist "%~dp0NewOutlookPatcher.dll" (
            echo Missing NewOutlookPatcher.dll
            pause
            exit /b 1
          )

          taskkill /F /IM olk.exe /T >nul 2>&1
          copy /Y "%~dp0NewOutlookPatcher.dll" "%SystemRoot%\System32\NewOutlookPatcher.dll" >nul

          powershell -NoProfile -ExecutionPolicy Bypass -Command "$base=[Microsoft.Win32.RegistryKey]::OpenBaseKey([Microsoft.Win32.RegistryHive]::LocalMachine,[Microsoft.Win32.RegistryView]::Registry64); $p='SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\olk.exe'; $k=$base.CreateSubKey($p); $g=$k.GetValue('GlobalFlag',$null); if($null -eq $g){$g=0}; $k.SetValue('GlobalFlag',([int]$g -bor 0x100),[Microsoft.Win32.RegistryValueKind]::DWord); $v=[string]$k.GetValue('VerifierDlls',''); if($v -notmatch '(^|\s)NewOutlookPatcher\.dll($|\s)'){$v=($v+' NewOutlookPatcher.dll').Trim()}; $k.SetValue('VerifierDlls',$v,[Microsoft.Win32.RegistryValueKind]::String); $k.Close(); $base.Close()"

          echo.
          echo Outlook ad hider installed.
          echo Opening Outlook...
          start "" explorer.exe "shell:AppsFolder\Microsoft.OutlookForWindows_8wekyb3d8bbwe!Microsoft.OutlookforWindows"
          echo.
          pause
          "@

          $uninstall = @"
          @echo off
          setlocal EnableExtensions
          title Outlook Ad Hider - UNINSTALL

          net session >nul 2>&1
          if not "%errorlevel%"=="0" (
            powershell -NoProfile -WindowStyle Hidden -Command "Start-Process -FilePath '%~f0' -Verb RunAs"
            exit /b
          )

          taskkill /F /IM olk.exe /T >nul 2>&1

          powershell -NoProfile -ExecutionPolicy Bypass -Command "$base=[Microsoft.Win32.RegistryKey]::OpenBaseKey([Microsoft.Win32.RegistryHive]::LocalMachine,[Microsoft.Win32.RegistryView]::Registry64); $p='SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\olk.exe'; $k=$base.OpenSubKey($p,$true); if($k){ $v=[string]$k.GetValue('VerifierDlls',''); $parts=@($v -split '\s+' | Where-Object {$_ -and $_ -ne 'NewOutlookPatcher.dll'}); if($parts.Count -eq 0){$k.DeleteValue('VerifierDlls',$false); $g=$k.GetValue('GlobalFlag',$null); if($null -ne $g){$n=[int]$g -band (-bnot 0x100); if($n -eq 0){$k.DeleteValue('GlobalFlag',$false)}else{$k.SetValue('GlobalFlag',$n,[Microsoft.Win32.RegistryValueKind]::DWord)}}}else{$k.SetValue('VerifierDlls',($parts -join ' '),[Microsoft.Win32.RegistryValueKind]::String)}; $k.Close() }; $base.Close()"

          del /F /Q "%SystemRoot%\System32\NewOutlookPatcher.dll" >nul 2>&1

          echo.
          echo Outlook ad hider uninstalled.
          start "" explorer.exe "shell:AppsFolder\Microsoft.OutlookForWindows_8wekyb3d8bbwe!Microsoft.OutlookforWindows"
          echo.
          pause
          "@

          $readme = @"
          Outlook Ad Hider
          -----------------
          This build hides only the New Outlook message-list advertising row.

          CSS selector:
          [data-message-ad-id] { display: none !important; }

          Chrome and Chrome cache are not touched.
          "@

          Set-Content -Path (Join-Path $package "INSTALL-Outlook-Ad-Hider.cmd") -Value $install -Encoding ASCII
          Set-Content -Path (Join-Path $package "UNINSTALL-Outlook-Ad-Hider.cmd") -Value $uninstall -Encoding ASCII
          Set-Content -Path (Join-Path $package "README.txt") -Value $readme -Encoding UTF8

      - name: Upload ready package
        uses: actions/upload-artifact@v4
        with:
          name: Outlook-Ad-Hider-Ready
          path: package
          if-no-files-found: error
